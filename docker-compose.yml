services:

  # ============================================================
  # ZOOKEEPER
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0

    container_name: instacart-zookeeper

    restart: unless-stopped

    ports:
      - "22181:2181"

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.0

    container_name: instacart-kafka

    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "29092:29092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data


  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:15

    container_name: instacart-postgres

    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: instacart

    volumes:
      - postgres-data:/var/lib/postgresql/data

      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro

      - ./database:/opt/instacart/database

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d instacart"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # ============================================================
  # SPARK MASTER
  # ============================================================

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark

    image: instacart-spark:latest

    container_name: instacart-spark-master

    restart: unless-stopped

    ports:
      - "7077:7077"
      - "18080:8080"

    environment:
      SPARK_MASTER_HOST: spark-master

      SPARK_MASTER_PORT: 7077

      SPARK_MASTER_WEBUI_PORT: 8080

      SPARK_DRIVER_MEMORY: 4g

      SPARK_EXECUTOR_MEMORY: 4g

    volumes:
      - ./spark:/opt/spark/app

      - ./data:/opt/spark/data

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

      - --host
      - spark-master

      - --port
      - "7077"

      - --webui-port
      - "8080"


  # ============================================================
  # SPARK WORKER
  # ============================================================

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark

    image: instacart-spark:latest

    container_name: instacart-spark-worker

    restart: unless-stopped

    depends_on:
      - spark-master

    ports:
      - "18081:8081"

    environment:
      SPARK_WORKER_CORES: 4

      SPARK_WORKER_MEMORY: 8g

      SPARK_WORKER_WEBUI_PORT: 8081

    volumes:
      - ./spark:/opt/spark/app

      - ./data:/opt/spark/data

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker

      - spark://spark-master:7077


  # ============================================================
  # AIRFLOW INIT
  # ============================================================

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: instacart-airflow-spark:latest

    container_name: instacart-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow

      AIRFLOW__WEBSERVER__SECRET_KEY: instacart-local-secret-key

      AIRFLOW__CORE__FERNET_KEY: ""

      _AIRFLOW_WWW_USER_USERNAME: admin

      _AIRFLOW_WWW_USER_PASSWORD: admin

    volumes:
      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - ./data:/opt/instacart/data

      - ./kafka:/opt/instacart/kafka

      - ./spark:/opt/instacart/spark

      - ./database:/opt/instacart/database

    command:
      - bash
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true


  # ============================================================
  # AIRFLOW WEBSERVER
  # ============================================================

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: instacart-airflow-spark:latest

    container_name: instacart-airflow-webserver

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

      spark-master:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow

      AIRFLOW__WEBSERVER__SECRET_KEY: instacart-local-secret-key

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_HOME: /opt/spark

      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      PATH: /opt/spark/bin:/opt/spark/sbin:/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_DB: instacart

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    volumes:
      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - ./data:/opt/instacart/data

      - ./kafka:/opt/instacart/kafka

      - ./spark:/opt/instacart/spark

      - ./database:/opt/instacart/database

    command:
      - airflow
      - webserver


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: instacart-airflow-spark:latest

    container_name: instacart-airflow-scheduler

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

      spark-master:
        condition: service_started

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow

      AIRFLOW__WEBSERVER__SECRET_KEY: instacart-local-secret-key

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_HOME: /opt/spark

      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      PATH: /opt/spark/bin:/opt/spark/sbin:/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_DB: instacart

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    volumes:
      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - ./data:/opt/instacart/data

      - ./kafka:/opt/instacart/kafka

      - ./spark:/opt/instacart/spark

      - ./database:/opt/instacart/database

    command:
      - airflow
      - scheduler


  # ============================================================
  # STREAMLIT
  # ============================================================

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    image: instacart-streamlit:latest

    container_name: instacart-streamlit

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8501:8501"

    environment:
      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_DB: instacart

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    volumes:
      - ./streamlit:/app

    working_dir: /app

    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501


# ============================================================
# VOLUMES
# ============================================================

volumes:
  zookeeper-data:

  zookeeper-log:

  kafka-data:

  postgres-data:
